name: release

# v* のタグ(例: v0.1.0)を push すると、3 OS でビルド・検査して GitHub Release を作る
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # 手で実行するとき: tag を空にすると zip の確認だけ、tag を書くとそのタグを今の main に作って Release を公開する
    inputs:
      tag:
        description: "作る Release のタグ(例: v0.1.0)。空なら確認だけ"
        required: false
        default: ""

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*.zip"
          path: artifacts
          merge-multiple: true
          skip-decompress: true   # zip のまま受け取る(既定では展開してしまう)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -e
          files=$(find artifacts -name "*.zip" -type f | sort)
          echo "$files"
          for f in $files; do unzip -l "$f" | head -12; done
          test $(echo "$files" | wc -l) -eq 4
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="${INPUT_TAG}"
            if [ -z "$TAG" ]; then echo "タグの指定がないので Release は作らない"; exit 0; fi
          fi
          gh release create "$TAG" $files --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "MPS Synth / MPS FX ${TAG#v}" \
            --notes "VST3 プラグイン MPS Synth / MPS FX。インストール方法は README を見てください。macOS 版は Apple Silicon と Intel のユニバーサルです。"
