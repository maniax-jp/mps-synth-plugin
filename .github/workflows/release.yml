name: release

# v* のタグ(例: v0.1.0)を push すると、3 OS でビルド・検査して GitHub Release を作る
on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          gh release create "${GITHUB_REF_NAME}" artifacts/*.zip --repo "${GITHUB_REPOSITORY}" \
            --title "MPS Synth / MPS FX ${GITHUB_REF_NAME#v}" \
            --notes "VST3 プラグイン MPS Synth / MPS FX(製造元 Maniax)。インストール方法は README を見てください。macOS 版は Apple Silicon と Intel のユニバーサルです。"
